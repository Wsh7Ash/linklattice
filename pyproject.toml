[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linklattice"
version = "0.1.0"
description = "Offline Markdown reference integrity checker for broken links, images and heading anchors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "linklattice contributors" }]
keywords = ["markdown", "links", "anchors", "documentation", "linter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
linklattice = "linklattice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
